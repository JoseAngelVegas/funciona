<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA de Texto a Voz (Open Source / Sin Copyright)</title>
    <!-- Cargamos ONNX Runtime Web para ejecutar IA en el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.0/dist/ort.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #10b981;
            --primary-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 24px;
        }

        select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .btn-generate {
            width: 100%;
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-generate:hover {
            background-color: var(--primary-hover);
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .btn-generate:disabled {
            background-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ IA de Voz Neuronal (Open Source)</h1>
        <p class="subtitle">Modelo libre ejecutándose 100% en tu navegador (Sin depender de Microsoft/Google).</p>

        <div class="input-group">
            <label for="text-input">Texto a sintetizar</label>
            <textarea id="text-input" placeholder="Escribe aquí en español o inglés...">Hola, esta voz está siendo generada por un modelo de inteligencia artificial de código abierto ejecutándose localmente en tu navegador.</textarea>
        </div>

        <div class="controls-grid">
            <div class="input-group" style="margin-bottom: 0;">
                <label for="voice-select">Estilo de Voz (Neuronal)</label>
                <select id="voice-select">
                    <option value="af_heart">Voz Femenina Natural (Heart - American/General)</option>
                    <option value="am_fenrir">Voz Masculina Profunda (Fenrir)</option>
                    <option value="af_nicole">Voz Femenina Suave (Nicole)</option>
                </select>
            </div>
        </div>

        <button class="btn-generate" id="speak-btn">
            <span>✨ Generar y Reproducir Audio IA</span>
        </button>

        <div class="status" id="status-text">Listo. (La primera vez descargará el motor de IA de forma automática).</div>
    </div>

    <!-- Importamos la librería Transformers.js para correr el modelo TTS open-source en cliente -->
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.2.4';

        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const speakBtn = document.getElementById('speak-btn');
        const statusText = document.getElementById('status-text');

        let synthesizer = null;

        async function initModel() {
            if (synthesizer) return;
            try {
                speakBtn.disabled = true;
                statusText.textContent = 'Descargando modelo de IA open-source (puede tardar unos segundos la 1ª vez)...';
                
                // Usamos un modelo ligero de texto a voz de Hugging Face compatible con navegador
                synthesizer = await pipeline('text-to-speech', 'Xenova/speecht5_tts');
                
                statusText.textContent = '¡Modelo listo para usar!';
                speakBtn.disabled = false;
            } catch (error) {
                console.error(error);
                statusText.textContent = 'Error al cargar el modelo de IA local.';
                speakBtn.disabled = false;
            }
        }

        // Precargar en segundo plano
        initModel();

        speakBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                statusText.textContent = 'Por favor, escribe algún texto.';
                return;
            }

            try {
                speakBtn.disabled = true;
                statusText.textContent = 'Generando audio neuronal...';

                if (!synthesizer) {
                    await initModel();
                }

                // Generar el audio con la IA open-source
                const speakerId = voiceSelect.value === 'am_fenrir' ? 7306 : 8030; // IDs de locutores internos del modelo
                const output = await synthesizer(text, {
                    // Configuraciones adicionales del pipeline si aplican
                });

                statusText.textContent = 'Reproduciendo audio generado...';

                // Convertir la salida del modelo a un Blob de audio reproducible
                const wavAudio = new Audio(URL.createObjectURL(output.audio));
                wavAudio.play();

                wavAudio.onended = () => {
                    statusText.textContent = 'Reproducción finalizada.';
                    speakBtn.disabled = false;
                };

            } catch (err) {
                console.error(err);
                statusText.textContent = 'Ocurrió un error al generar la voz.';
                speakBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
