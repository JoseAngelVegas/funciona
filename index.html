<!DOCTYPE html>

<html>

<body>

<head>

 <img class="menu" onclick="audio()" src="https://github.com/JoseAngelVegas/ampamix/blob/main/Audio.png?raw=true" width="150" height="150">
 <img class="menu" src="https://github.com/JoseAngelVegas/ampamix/blob/main/Texto.png?raw=true" width="150" height="150">
 <img class="menu" onclick="video(), videoAnimacion()"  src="https://github.com/JoseAngelVegas/ampamix/blob/main/Videos.png?raw=true" width="150" height="150">

 <div></div>

  <img id="animacion" class="video" onclick="Josechicha()" src="https://github.com/JoseAngelVegas/ampamix/blob/main/Josechicha.png?raw=true" width="0" height="0">
  <img id="animacion" class="video" onclick="Nosotros()" src="https://github.com/JoseAngelVegas/ampamix/blob/main/La%20Superioridad%20De%20NOSOTROS.png?raw=true" width="0" height="0">

 <script>

  function audio() {

      const cerrarInicio = document.querySelectorAll(".menu");
      for (let i = 0; i < cerrarInicio.length; i++) {
         cerrarInicio[i].style.width = "0px";
         cerrarInicio[i].style.height = "0px";
         cerrarInicio[i].style.visibility = "hidden";
         
      }
  }

  function texto() {

      const cerrarInicio = document.querySelectorAll(".menu");
      for (let i = 0; i < cerrarInicio.length; i++) {
         cerrarInicio[i].style.width = "0px";
         cerrarInicio[i].style.height = "0px";
         cerrarInicio[i].style.visibility = "hidden";
         
      }
  }

  function video() {

      const cerrarInicio = document.querySelectorAll(".menu");
      for (let i = 0; i < cerrarInicio.length; i++) {
         cerrarInicio[i].style.filter = "blur(5px)";
         cerrarInicio[i].style.width = "80px";
         cerrarInicio[i].style.height = "80px";
         
         
      }

    const abrir = document.querySelectorAll(".video");
      for (let i = 0; i < abrir.length; i++) {
         abrir[i].style.width = "120px";
         abrir[i].style.height = "120px";
         
      }
      
      
  }

  </script>
  
  <script>
  
   function videoAnimacion() {
  var el = document.getElementById('animacion');
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = null;
  
  document.getElementById('animacion').style.animationPlayState = "running"
  
}
  
  </script>


   <style>

    .menu {
     box-shadow: 0px 0px 5px black;
    border-radius: 20px;
    margin: 0 auto;
    display: flex;
    transform: translateY(50%);
     
    }

    div {
     background-color: black;
     width: %;
     height: %;
     opacity: 50%;
     position: fixed;
     top: 7px;
    }

    .video {
    position: relative;
    box-shadow: 0px 5px 20px black;
    border-radius: 100px;
    margin: 0 auto;
    display: flex;
    transform: translateY(-100%);
    }
    
    #animacion {
  position: relative;
  animation: bounce 5s;
  animation-fill-mode: both;
  animation-play-state: paused;


}

@keyframes bounce {
  0% { width: 0%; }
  100% { width: 50%; }
}

      body {
background: #58df8c;
background: -webkit-linear-gradient(95deg, rgba(88, 223, 140, 1) 0%, rgba(91, 203, 207, 1) 44%, rgba(99, 201, 162, 1) 80%, rgba(83, 237, 219, 1) 100%);
background: -moz-linear-gradient(95deg, rgba(88, 223, 140, 1) 0%, rgba(91, 203, 207, 1) 44%, rgba(99, 201, 162, 1) 80%, rgba(83, 237, 219, 1) 100%);
background: linear-gradient(95deg, rgba(88, 223, 140, 1) 0%, rgba(91, 203, 207, 1) 44%, rgba(99, 201, 162, 1) 80%, rgba(83, 237, 219, 1) 100%);
filter: progid:DXImageTransform.Microsoft.gradient(startColorstr="#58DF8C", endColorstr="#53EDDB", GradientType=0);
      }

   @media only screen and (max-width:500px) {
            .button, .submit, .mas, .input {
               width: 40%;
            }
         }

</style>

</body>

</head>

</html>
