<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realidad Aumentada Móvil</title>
    
    <!-- Incluir A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- Incluir AR.js corregido -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #ui-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 12px;
            color: white;
            pointer-events: none;
        }
        h1 {
            font-size: 16px;
            margin: 0 0 5px 0;
        }
        p {
            font-size: 12px;
            margin: 0;
            color: #ddd;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Interfaz informativa -->
    <div id="ui-container">
        <h1>Visor AR Múltiple</h1>
        <p>Apunta la cámara al marcador <strong>HIRO</strong></p>
    </div>

    <!-- Escena de Realidad Aumentada -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false">

        <!-- Definir el marcador Hiro -->
        <a-marker preset="hiro">
            
            <!-- Cubo rojo -->
            <a-box 
                position="0 0.5 0" 
                rotation="0 45 0" 
                scale="0.5 0.5 0.5" 
                material="color: #EF2D5E; roughness: 0.4;">
            </a-box>

            <!-- Esfera verde -->
            <a-sphere 
                position="-1 0.6 0" 
                radius="0.4" 
                material="color: #2ECC71; metalness: 0.3;">
            </a-sphere>

            <!-- Cilindro azul -->
            <a-cylinder 
                position="1 0.5 0" 
                radius="0.3" 
                height="0.8" 
                material="color: #3498DB;"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;">
            </a-cylinder>

            <!-- Texto flotante -->
            <a-text 
                value="¡Objetos 3D en AR!" 
                position="-0.9 1.4 0" 
                scale="0.7 0.7 0.7" 
                color="#FFFFFF">
            </a-text>

        </a-marker>

        <!-- Cámara de la escena AR -->
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
