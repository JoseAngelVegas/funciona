<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Nativo en JS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #4a90e2;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        .chat-messages {
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 6px;
            max-width: 80%;
            line-height: 1.4;
        }
        .message.user {
            background: #e1f5fe;
            align-self: flex-end;
            color: #01579b;
        }
        .message.bot {
            background: #f1f0f0;
            align-self: flex-start;
            color: #333;
        }
        .chat-input-area {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 10px;
            background: #fafafa;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .chat-input-area button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .chat-input-area button:hover {
            background: #357abd;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Asistente Contextual Nativo</div>
    <div id="chatMessages" class="chat-messages">
        <div class="message bot">¡Hola! Pregúntame sobre mis historias (como cuando me tomé un jugo de piña) o intenta decir alguna palabra prohibida.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    // --- 1. CONFIGURACIÓN DE REQUISITOS ---

    // Lista de palabras prohibidas (tanto para el usuario como para el bot)
    const palabrasProhibidas = ["cactus", "auto", "dormir"];

    // Base de conocimiento / Fuente de contexto interna
    const baseConocimiento = [
        {
            triggers: ["jugo", "piña", "jugo de piña"],
            historia: "Recuerdo perfectamente esa vez. Fue una tarde calurosa de verano en el año 2023. Fui a un puesto callejero y pedí un vaso grande de jugo de piña natural recién exprimido. Estaba tan frío y dulce que se convirtió en mi bebida favorita instantáneamente."
        },
        {
            triggers: ["hola", "saludos", "buenas"],
            historia: "¡Hola! Estoy listo para conversar contigo usando mi base de datos interna."
        },
        {
            triggers: ["quien eres", "que eres"],
            historia: "Soy un asistente virtual creado puramente con JavaScript nativo, sin APIs externas."
        }
    ];

    // --- 2. LÓGICA DEL CHATBOT ---

    function contienePalabraProhibida(texto) {
        const textoMinuscula = texto.toLowerCase();
        return palabrasProhibidas.some(palabra => textoMinuscula.includes(palabra));
    }

    function generarRespuesta(mensajeUsuario) {
        // Verificar si el usuario usó una palabra prohibida
        if (contienePalabraProhibida(mensajeUsuario)) {
            return "⚠️ Lo siento, no puedo procesar tu mensaje porque contiene una palabra prohibida en mis normas.";
        }

        const mensajeLower = mensajeUsuario.toLowerCase();
        let respuestaEncontrada = null;

        // Buscar coincidencias en la fuente de contexto
        for (let item of baseConocimiento) {
            let coincide = item.triggers.some(trigger => mensajeLower.includes(trigger));
            if (coincide) {
                respuestaEncontrada = item.historia;
                break;
            }
        }

        // Si no encuentra nada específico en el contexto
        if (!respuestaEncontrada) {
            respuestaEncontrada = "No tengo información exacta sobre eso en mi contexto interno, pero puedes preguntarme por la vez que me tomé un jugo de piña.";
        }

        // Doble validación: Asegurar que la respuesta generada tampoco tenga palabras prohibidas
        if (contienePalabraProhibida(respuestaEncontrada)) {
            return "⚠️ Error de seguridad: La respuesta generada contenía una palabra prohibida y fue bloqueada.";
        }

        return respuestaEncontrada;
    }

    // --- 3. INTERFAZ DE USUARIO ---

    function agregarMensaje(texto, remitente) {
        const chatMessages = document.getElementById("chatMessages");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${remitente}`;
        messageDiv.textContent = texto;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll
    }

    function sendMessage() {
        const input = document.getElementById("userInput");
        const textoUsuario = input.value.trim();

        if (textoUsuario === "") return;

        // Mostrar mensaje del usuario
        agregarMensaje(textoUsuario, "user");
        input.value = "";

        // Simular pequeño retraso de respuesta (efecto natural)
        setTimeout(() => {
            const respuestaBot = generarRespuesta(textoUsuario);
            agregarMensaje(respuestaBot, "bot");
        }, 300);
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
