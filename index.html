<!DOCTYPE html>
<html>
<head>
<body>

<div id="container">
<button type="button"><span>Hola</span></button>
</div>

<style>

@import url(https://fonts.googleapis.com/css?family=Passion+One);

:root {
  --hue: 0deg;
}

body, html {
  height: 100%;
  display: grid;
  padding: 0;
  margin: 0;
    background-image: url("https://uvn-brightspot.s3.amazonaws.com/assets/vixes/btg/curiosidades.batanga.com/files/Hay-agua-potable-bajo-los-oceanos-1.jpg"), url("https://uvn-brightspot.s3.amazonaws.com/assets/vixes/btg/curiosidades.batanga.com/files/Hay-agua-potable-bajo-los-oceanos-1.jpg");

}

#container {
  margin: auto;
  border-radius: 100%;
  transition: all 0.4s ease-in-out;
  &:hover {
    transform: scale(1.03);
  }
  @media (max-width: 468px) {
    width: 80%;
  }
}

button {
  --filter-hue-rotate: 0deg;
  --filter-brightness: 1;
  --filter-shadow: 0 0 0 transparent;
  aspect-ratio: 1;
  width: min(40vw, 40vh);
  background: radial-gradient(40vh, rgba(49, 54, 109, 0.5), transparent),
    radial-gradient(
      circle 30vw at top,
      rgba(1, 180, 210, 0.3),
      #638ad4,
      transparent
    ),
    radial-gradient(circle 20vw at bottom, #2550aa, transparent);
  font-size: min(8vw, 8vh);
  border-radius: 20%;
  border: none;
  opacity: 0.5;
  box-shadow: -10px 14px 24px -7px rgba(55, 254, 255, 0.82) inset,
    5px -10px 18px 4px rgba(55, 254, 255, 0.22) inset;
  animation: 6s ease-in reshape, 1.4s ease-in 5 color,
    6s cubic-bezier(0.2, -2, 0, 0.5) 15s infinite reshape,
    0.8s cubic-bezier(0.01, -0.5, 0, 0) 10s infinite color;
  animation-play-state: paused;
  transition: all 1s ease-in-out;
  &:hover {
    --filter-hue-rotate: 20deg;
    box-shadow: -10px 14px 24px -7px rgba(55, 254, 255, 0.82) inset,
      5px -10px 18px 4px rgba(55, 254, 255, 0.22) inset,
      0 0 30px 0 rgba(14, 64, 76, 0.5);
    animation-duration: 8s, 1s;
    & span {
      animation-play-state: running;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  }
  @media (max-width: 468px) {
    width: 100%;
    font-size: max(22px, 18vw);
  }
}

span {
  font-weight: bold;
  background: linear-gradient(
    120deg,
    rgba(255, 255, 255, 0.4) 0%,
    rgba(255, 255, 255, 0.9) 50%,
    rgba(255, 255, 255, 0.4) 100%
  );
  background-size: 200% auto;
  background-clip: text;
  text-fill-color: transparent;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  transition: all 2s;
  animation: 2s gradient infinite paused;
}


</style>




</body>
</html>
