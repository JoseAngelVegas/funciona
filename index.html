<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realidad Aumentada Móvil</title>
    
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/a5.js/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        /* Estilos para la interfaz de usuario superpuesta */
        #ui-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 12px;
            color: white;
            pointer-events: none;
        }
        h1 {
            font-size: 16px;
            margin: 0 0 5px 0;
        }
        p {
            font-size: 12px;
            margin: 0;
            color: #ddd;
        }
        .arjs-loader {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arjs-loader div {
            text-align: center;
            font-size: 1.25em;
            color: white;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div class="arjs-loader">
        <div>Cargando experiencia de Realidad Aumentada... Por favor, permite el acceso a la cámara.</div>
    </div>

    <div id="ui-container">
        <h1>Visor AR Múltiple</h1>
        <p>Apunta la cámara al marcador <strong>HIRO</strong></p>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        renderer="logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false">

        <a-marker preset="hiro">
            
            <a-box 
                position="0 0.5 0" 
                rotation="0 45 0" 
                scale="0.5 0.5 0.5" 
                material="color: #EF2D5E; roughness: 0.4;">
            </a-box>

            <a-sphere 
                position="-1 0.6 0" 
                radius="0.4" 
                material="color: #2ECC71; metalness: 0.3;">
            </a-sphere>

            <a-cylinder 
                position="1 0.5 0" 
                radius="0.3" 
                height="0.8" 
                material="color: #3498DB;"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear;">
            </a-cylinder>

            <a-text 
                value="¡Objetos 3D en AR!" 
                position="-0.9 1.4 0" 
                scale="0.7 0.7 0.7" 
                color="#FFFFFF">
            </a-text>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Script opcional en JavaScript para interactuar o depurar eventos
        window.addEventListener('load', () => {
            const marker = document.querySelector('a-marker');

            marker.addEventListener('markerFound', () => {
                console.log('¡Marcador Hiro detectado!');
            });

            marker.addEventListener('markerLost', () => {
                console.log('Marcador perdido.');
            });
        });
    </script>
</body>
</html>
